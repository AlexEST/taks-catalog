name: update-catalog
on:
  schedule:
    - cron: "17 4 * * *"   # daily 04:17 UTC = 06:17/07:17 Tallinn
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python tests/test_alexela.py
      - run: python tests/test_elektrum.py
      - run: python tests/test_enefit.py
      - run: python tests/test_viru_elenger.py
      - run: python scraper/main.py
      - name: commit if changed
        run: |
          git config user.name "taks-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || git commit -m "catalog update $(date -u +%F)"
          git push
